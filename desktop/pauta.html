<title>Pauta Jurídica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>/* Layout: app-frame com nav em pílulas no topo; grade 2/3 + 1/3 (desempenho + agenda),
   depois assistente escuro + tabela de bloqueios, depois contratos de gestão. Mesma linguagem do Buildex. */
:root{
  --bg:#F2F1F5; --surface:#FFFFFF; --surface-2:#F6F5F9; --surface-3:#ECEAF2;
  --ink:#15131A; --ink-2:#605D6D; --ink-3:#9894A5; --line:#E8E6EE;
  --accent:#7A35B0; --accent-soft:#F1E8F8; --accent-ink:#62268F;
  --c1:#6A2C96; --c2:#9B4FCB; --c3:#C99BEB;
  --cta:#15131A; --cta-ink:#FFFFFF;
  --ai-bg:#15131A; --ai-ink:#F4F2F8; --ai-ink-2:#8F8B9C; --ai-btn:#2A2731;
  --good:#1D9A55; --good-soft:#E3F5EA; --bad:#D13C58; --bad-soft:#FCE8EC; --on-bad:#FFFFFF;
  --warn:#B4700C; --warn-soft:#FBF0DC; --info:#2E6BD8; --info-soft:#E7EEFC;
  --shadow:0 1px 2px rgba(20,16,30,.04),0 10px 28px -14px rgba(40,20,70,.14);
  --scrim:rgba(24,20,32,.26);
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0C11; --surface:#17161D; --surface-2:#1D1C24; --surface-3:#26242E;
    --ink:#F1EFF6; --ink-2:#A7A3B5; --ink-3:#6F6B7D; --line:#2A2833;
    --accent:#B67EE6; --accent-soft:#2A1F37; --accent-ink:#D3AAF5;
    --c1:#8D4BC5; --c2:#B07AE4; --c3:#D6B1F4;
    --cta:#F1EFF6; --cta-ink:#15131A;
    --ai-bg:#211F29; --ai-ink:#F4F2F8; --ai-ink-2:#8F8B9C; --ai-btn:#322F3C;
    --good:#43C981; --good-soft:#12301F; --bad:#F26E86; --bad-soft:#3A1820; --on-bad:#1A0A0E;
    --warn:#E6A645; --warn-soft:#33260F; --info:#72A2F6; --info-soft:#172540;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 28px -14px rgba(0,0,0,.6);
    --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0C11; --surface:#17161D; --surface-2:#1D1C24; --surface-3:#26242E;
  --ink:#F1EFF6; --ink-2:#A7A3B5; --ink-3:#6F6B7D; --line:#2A2833;
  --accent:#B67EE6; --accent-soft:#2A1F37; --accent-ink:#D3AAF5;
  --c1:#8D4BC5; --c2:#B07AE4; --c3:#D6B1F4;
  --cta:#F1EFF6; --cta-ink:#15131A;
  --ai-bg:#211F29; --ai-ink:#F4F2F8; --ai-ink-2:#8F8B9C; --ai-btn:#322F3C;
  --good:#43C981; --good-soft:#12301F; --bad:#F26E86; --bad-soft:#3A1820; --on-bad:#1A0A0E;
  --warn:#E6A645; --warn-soft:#33260F; --info:#72A2F6; --info-soft:#172540;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 28px -14px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);letter-spacing:-.01em}

/* Header */
.top{display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:19px;letter-spacing:-.02em;flex:none}
.brand svg{color:var(--ink)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:3px}
.nav::-webkit-scrollbar{display:none}
.pill{border:0;background:transparent;color:var(--ink-2);font-size:13px;padding:8px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.pill:hover{color:var(--ink);background:var(--surface-3)}
.pill.on{background:var(--cta);color:var(--cta-ink)}
.tools{display:flex;gap:8px;align-items:center;flex:none}
.round{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative;box-shadow:var(--shadow)}
.badge{position:absolute;top:4px;right:5px;min-width:15px;height:15px;border-radius:8px;background:var(--bad);color:var(--on-bad);font-size:9px;font-weight:600;display:grid;place-items:center;padding:0 3px;border:2px solid var(--surface)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hello h1{font-size:clamp(26px,3.1vw,34px);font-weight:500;letter-spacing:-.03em;margin:0;text-wrap:balance;line-height:1.1}
.hello p{margin:6px 0 0;color:var(--ink-2);font-size:13.5px}
.hello-act{display:flex;gap:8px;flex-wrap:wrap}
.chip-date{background:var(--surface);border-radius:999px;padding:9px 14px;display:inline-flex;align-items:center;gap:8px;font-size:13px;box-shadow:var(--shadow)}
.btn{border:0;font-size:13px;font-weight:500;border-radius:999px;padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--cta);color:var(--cta-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}

/* Cards / grid */
.row{display:grid;gap:16px}
.r1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.r2{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
@media (max-width:1060px){.r1,.r2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border-radius:20px;padding:20px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:16px;font-weight:500;margin:0;letter-spacing:-.01em}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:5px 11px}
.link{border:0;background:none;color:var(--ink-2);font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.st{animation:rev .65s cubic-bezier(.2,.8,.2,1) both}

/* Desempenho */
.perf{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:720px){.perf{grid-template-columns:minmax(0,1fr)}}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transition:opacity .25s;cursor:pointer}
.ribbon{animation:fadein .7s .55s both}
.blabel{animation:fadein .5s .7s both}
@keyframes grow{from{transform:scaleY(.03)}}
@keyframes fadein{from{opacity:0}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.detail{margin-top:10px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:9px 12px;min-height:38px}
.detail b{color:var(--ink);font-weight:500}
.kpi-top{padding-bottom:14px}
.kpi-label{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13px}
.kpi-big{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.kpi-big .v{font-size:30px;font-weight:500;letter-spacing:-.03em}
.kpi-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line);font-size:13.5px}
.kpi-row .l{display:flex;align-items:center;gap:8px;color:var(--ink-2);flex:1;min-width:0}
.kpi-row .v{font-weight:500}
.delta{font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:999px;white-space:nowrap}
.delta.bad{color:var(--bad);background:var(--bad-soft)}
.delta.good{color:var(--good);background:var(--good-soft)}
.delta.neutral{color:var(--ink-2);background:var(--surface-3)}
.delta.accent{color:var(--accent-ink);background:var(--accent-soft)}

/* Agenda */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-bottom:14px}
.day{border:0;background:transparent;border-radius:999px;padding:6px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink-3);transition:background .25s,color .25s}
.day b{font-size:13.5px;font-weight:500;color:var(--ink);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;transition:background .25s}
.day small{font-size:10.5px}
.day i{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:0}
.day i.has{opacity:1}
.day.on{background:var(--cta);color:var(--cta-ink)}
.day.on b{background:var(--surface);color:var(--ink)}
.day.on i{background:var(--cta-ink)}
.evs{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:999px;padding:7px 16px 7px 7px;animation:rev .45s cubic-bezier(.2,.8,.2,1) both}
.ev-ic{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.ev-txt{min-width:0;flex:1}
.ev-t{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-s{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-m{text-align:right;font-size:11.5px;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.prio{display:inline-flex;align-items:center;gap:4px;font-weight:500}
.prio.alta{color:var(--bad)} .prio.media{color:var(--warn)} .prio.baixa{color:var(--info)}
.empty{font-size:13px;color:var(--ink-3);padding:22px 0;text-align:center}

/* Assistente (Intelligent Box) */
.ai{background:var(--ai-bg);color:var(--ai-ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ai-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px 0}
.ai-h h2{font-size:15.5px;font-weight:500;margin:0;display:flex;align-items:center;gap:8px}
.ai-btns{display:flex;gap:6px}
.ai-btn{width:34px;height:34px;border-radius:50%;background:var(--ai-btn);color:var(--ai-ink);border:0;display:grid;place-items:center;cursor:pointer;transition:transform .2s}
.ai-btn:hover{transform:scale(1.06)}
.ai-panel{background:var(--surface);color:var(--ink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:14px;flex:1}
.ai-top{display:flex;gap:12px;align-items:center}
.sugs{display:flex;flex-direction:column;gap:8px;align-items:flex-start;flex:1;min-width:0}
.sug{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 13px 4px 4px;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer;transition:border-color .2s,color .2s,transform .2s;max-width:100%}
.sug:hover{color:var(--ink);border-color:var(--ink-3);transform:translateX(2px)}
.sug-ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--surface);flex:none}
.illus{width:40%;max-width:170px;flex:none;color:var(--ink-3)}
.illus .tw{animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.15}}
.box-in{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:16px;padding:10px 8px 8px 14px;background:var(--surface);transition:border-color .2s,box-shadow .2s}
.box-in:focus-within{border-color:var(--ink-3)}
.box-in textarea,.composer textarea{border:0;resize:none;font:inherit;font-size:13px;flex:1;min-width:0;background:transparent;color:var(--ink);outline:none;line-height:1.45;min-height:38px}
.box-in textarea::placeholder,.composer textarea::placeholder{color:var(--ink-3)}
.send{width:32px;height:32px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-3);cursor:pointer;flex:none;transition:background .25s,color .25s,transform .25s}
.send.ready{background:var(--cta);color:var(--cta-ink);transform:scale(1.06)}
.send.ready:hover{transform:scale(1.12)}
.ai-note{font-size:11px;color:var(--ai-ink-2);padding:0 4px}

/* Tabela de bloqueios */
.search{display:flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:7px 12px;color:var(--ink-3)}
.search input{border:0;background:transparent;color:var(--ink);font:inherit;font-size:12.5px;width:160px;outline:none}
.search input::placeholder{color:var(--ink-3)}
.tbl-wrap{overflow-x:auto;margin:0 -6px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th{font-size:11.5px;font-weight:500;color:var(--ink-3);text-align:left;padding:9px 10px;background:var(--surface-2);white-space:nowrap}
th:first-child{border-radius:10px 0 0 10px} th:last-child{border-radius:0 10px 10px 0}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.tile{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;font-weight:600;flex:none}
.t1{background:var(--accent-soft);color:var(--accent-ink)} .t2{background:var(--warn-soft);color:var(--warn)} .t3{background:var(--info-soft);color:var(--info)} .t4{background:var(--good-soft);color:var(--good)}
.who-n{font-weight:500;font-size:13px}
.who-s{font-size:11.5px;color:var(--ink-3)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:999px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-bloq{color:var(--bad);background:var(--bad-soft)}
.s-parcial{color:var(--warn);background:var(--warn-soft)}
.s-ok{color:var(--good);background:var(--good-soft)}
.s-analise{color:var(--info);background:var(--info-soft)}
.s-perdido{color:var(--ink-2);background:var(--surface-3)}
.s-medida{color:var(--accent-ink);background:var(--accent-soft)}
tr.flash td{animation:flash 2.2s ease-out}
@keyframes flash{0%,30%{background:var(--accent-soft)}100%{background:transparent}}

/* Contratos de gestão */
.cg-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1060px){.cg-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cg-grid{grid-template-columns:minmax(0,1fr)}}
.cg{background:var(--surface-2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cg-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cg-no{font-family:var(--mono);font-size:11.5px;color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.cg-name{font-weight:500;font-size:14px;letter-spacing:-.01em}
.cg-ente{font-size:12px;color:var(--ink-3);margin-top:2px}
.track{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.fill{height:100%;border-radius:3px;background:var(--accent);transform-origin:left;animation:fillx 1.1s .3s cubic-bezier(.2,.8,.2,1) both}
.fill.warn{background:var(--warn)}
@keyframes fillx{from{transform:scaleX(0)}}
.vig{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:6px}
.cg-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:12px}
.cg-stats small{display:block;font-size:11px;color:var(--ink-3)}
.cg-stats b{font-size:13.5px;font-weight:500}
.foot{font-size:11.5px;color:var(--ink-3);text-align:center}

/* Chat */
.chat{background:var(--surface);border-radius:24px;display:flex;flex-direction:column;min-height:min(80vh,860px);padding:14px clamp(14px,2.4vw,24px) 18px}
.chat-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px;flex-wrap:wrap}
.ctx{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);border:0;background:none;cursor:pointer;padding:6px 4px}
.thread{flex:1;display:flex;flex-direction:column;gap:22px;padding:14px 0 28px;max-width:980px;width:100%;margin:0 auto;min-width:0}
.bubble{align-self:flex-end;background:var(--cta);color:var(--cta-ink);padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:min(560px,92%);font-size:13.5px;animation:rev .45s cubic-bezier(.2,.8,.2,1) both}
.thinking{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);padding-left:2px}
.thinking svg{color:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.75) rotate(20deg);opacity:.6}}
.shimmer{background:linear-gradient(90deg,var(--ink-3) 0%,var(--ink) 45%,var(--ink-3) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.5s linear infinite}
@keyframes sh{from{background-position:120% 0}to{background-position:-120% 0}}
.steps{display:flex;flex-direction:column;gap:4px;padding-left:25px;font-size:12px;color:var(--ink-3)}
.steps span{display:flex;align-items:center;gap:6px;animation:rev .35s both}
.answer{display:flex;flex-direction:column;gap:14px;min-width:0}
.rev{animation:rev .65s cubic-bezier(.2,.8,.2,1) both}
@keyframes rev{from{opacity:0;filter:blur(8px);transform:translateY(8px)}}
.ans-hi{font-size:12.5px;color:var(--ink-3)}
.ans-lead{font-size:16px;font-weight:500;letter-spacing:-.01em;max-width:60ch;text-wrap:pretty;margin:2px 0 0}
.ans-sub{font-size:13.5px;color:var(--ink-2);max-width:66ch;margin:0;padding-top:12px;border-top:1px solid var(--line)}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);color:var(--ink)}
.cards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;scrollbar-width:thin}
.rc{scroll-snap-align:start;border:1.5px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .25s,border-color .25s,box-shadow .25s}
.rc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.rc.sel{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.rc-top{background:var(--accent-soft);padding:14px;display:flex;flex-direction:column;gap:4px;position:relative;margin:6px 6px 0;border-radius:13px}
.rc-v{font-size:22px;font-weight:500;letter-spacing:-.03em;color:var(--accent-ink)}
.rc-c{font-size:11.5px;color:var(--ink-2)}
.rc-tag{position:absolute;top:10px;right:10px;font-size:10.5px;background:var(--surface);color:var(--ink-2);border-radius:999px;padding:3px 8px}
.rc-b{padding:12px 14px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}

/* Modal */

.md-t{font-size:14.5px;line-height:1.6;color:var(--ink);max-width:72ch}
.md-t p{margin:0 0 10px}
.md-t h3{font-size:16px;font-weight:500;margin:18px 0 8px;letter-spacing:-.01em}
.md-t ul,.md-t ol{margin:0 0 10px;padding-left:20px}
.md-t li{margin:3px 0}
.md-t strong{font-weight:600}
.gcard{background:var(--surface-2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;animation:rev .5s both}
.gcard h5{margin:0;font-size:13.5px;font-weight:500}
.ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.ind div{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.ind small{display:block;font-size:12px;color:var(--ink-2)}
.ind b{display:block;font-size:22px;font-weight:500;letter-spacing:-.02em;margin:4px 0 2px}
.acs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ac{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;animation:rev .5s both;transition:border-color .2s,transform .2s}
.ac:hover{border-color:var(--ink-3);transform:translateY(-2px)}
.ac .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ac .n{font-weight:500;font-size:13.5px}
.ac .s{font-size:12px;color:var(--ink-3)}
.steps2{display:flex;flex-direction:column;gap:4px;padding-left:25px;font-size:12px;color:var(--ink-3)}
.steps2 span{display:flex;align-items:center;gap:6px;animation:rev .35s both}
.ctxchip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:5px 6px 5px 12px}
.ctxchip button{border:0;background:var(--surface);border-radius:999px;width:22px;height:22px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px 14px;font-size:13px}
.pending{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:8px}

/* paleta de busca */
.cmd{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:70;display:flex;justify-content:center;align-items:flex-start;padding:max(10vh,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));animation:fadein .2s both}
.cmd-box{background:var(--surface);border-radius:20px;width:min(640px,100%);box-shadow:0 30px 80px -20px rgba(10,6,20,.4);overflow:hidden;animation:pop .35s cubic-bezier(.2,.9,.25,1.05) both}
.cmd-in{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);color:var(--ink-3)}
.cmd-in input{flex:1;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);outline:none;min-width:0}
.cmd-l{max-height:min(420px,60vh);overflow:auto;padding:8px}
.cmd-g{font-size:11px;color:var(--ink-3);padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.06em}
.cmd-i{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;border:0;background:none;width:100%;text-align:left;cursor:pointer;color:var(--ink);font-size:13px}
.cmd-i[aria-selected="true"]{background:var(--surface-2)}
.cmd-i small{display:block;color:var(--ink-3);font-size:11.5px}
.dates{font-size:12px;color:var(--ink-3)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawl 1.1s .15s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes drawl{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.draw{stroke-dashoffset:0}}
.tile.lg{display:grid;place-items:center;text-align:center}
.row.r2{align-items:start}
.toolbar .search input{width:210px}
.svgc{width:100%;max-width:100%}
@media (max-width:1240px){.hide-md{display:none}}
@media (max-width:1060px){.r3{grid-template-columns:minmax(0,1fr)}}

    ${[[devolvido, MONEY.devolvido], [perdido, MONEY.perdido], [bloqueado, MONEY.bloqueado]].map(([v, c], k) => v > 0 ? html`<i key=${k} style=${{width: (v / t * 100) + '%', background: c, animationDelay: (k * 120) + 'ms'}}></i>` : null)}
  </div>`;
}

/* ================= Processos ================= */
function Processos({opts, go, seg, toggleSeg, ask}){
  const [q, setQ] = useState('');
  const [cli, setCli] = useState(opts.cli || null);
  const [area, setArea] = useState(null);
  const [parados, setParados] = useState(!!opts.parados);
  const [comBloq, setComBloq] = useState(false);
  const [sigo, setSigo] = useState(!!opts.sigo);
  const [ord, setOrd] = useState(opts.parados ? 'parado' : 'recente');
  const [sel, setSel] = useState(opts.sel || null);
  const f = D.Lr ? q.trim().toLowerCase() : '';
  let list = Se.filter(p => (!cli || p.clienteId === cli) && (!area || p.area === area) && (!parados || p.diasParado >= PARADO)
    && (!comBloq || bloqAtivo(p) > 0) && (!sigo || seg.has(p.id))
    && (!f || (p.numero + p.desc + p.cliente + p.contrato + p.status).toLowerCase().includes(f)));
  const ORD = {recente:(a, b) => a.diasParado - b.diasParado, parado:(a, b) => b.diasParado - a.diasParado, valor:(a, b) => b.valorCausa - a.valorCausa, bloq:(a, b) => bloqAtivo(b) - bloqAtivo(a)};
  list = list.slice().sort(ORD[ord]);
  const cur = (sel && procById(sel)) || list[0];
  return html`<div className="view">
    <div className="hello st"><div><h1>Processos</h1><p>${Se.length} processos dos 4 clientes. Clique num processo para ver as movimentações e os bloqueios.</p></div></div>
    <div className="md">
      <${Card} delay="60ms">
        <div className="toolbar">
          <label className="search"><${Icon} n="search" s=${14}/><input id="proc-q" placeholder="Número, cliente ou assunto" value=${q} onInput=${e => setQ(e.target.value)}/></label>
          <div className="chips">${[[null, 'Todos'], ...ti.map(id => [id, fe[id].name])].map(([id, l]) => html`<button key=${l} className="fbtn" aria-pressed=${cli === id} onClick=${() => setCli(id)}>${l}</button>`)}</div>
        </div>
        <div className="toolbar">
          <div className="chips">${[null, ...AREAS].map(a => html`<button key=${a || 't'} className="fbtn" aria-pressed=${area === a} onClick=${() => setArea(a)}>${a || 'Todas as áreas'}</button>`)}</div>
          <span className="grow"></span>
          <div className="chips">
            <button className="fbtn" aria-pressed=${parados} onClick=${() => setParados(v => !v)}><${Icon} n="clock" s=${13}/>Parados ${PARADO}+ dias</button>
            <button className="fbtn" aria-pressed=${comBloq} onClick=${() => setComBloq(v => !v)}><${Icon} n="lock" s=${13}/>Com bloqueio</button>
            <button className="fbtn" aria-pressed=${sigo} onClick=${() => setSigo(v => !v)}><${Icon} n="bookmark" s=${13}/>Sigo <span className="n">${seg.size}</span></button>
          </div>
        </div>
        <div className="toolbar"><span className="cnt">${list.length} de ${Se.length} processos</span><span className="grow"></span>
          <div className="seg" role="group" aria-label="Ordenar">${[['recente', 'Movimentados'], ['parado', 'Mais parados'], ['valor', 'Maior valor'], ['bloq', 'Mais bloqueado']].map(([k, l]) => html`<button key=${k} aria-pressed=${ord === k} onClick=${() => setOrd(k)}>${l}</button>`)}</div></div>
        <div className="tbl-wrap"><table className="sel">
          <thead><tr><th>Processo</th><th>Cliente · contrato</th><th className="hide-md">Área</th><th>Situação</th><th className="r">Em discussão</th><th className="r">Bloqueado</th></tr></thead>
          <tbody>${list.map(p => { const bl = bloqAtivo(p);
            return html`<tr key=${p.id} aria-selected=${cur && cur.id === p.id} onClick=${() => setSel(p.id)}>
              <td><span className="mono">${p.numero}</span>${seg.has(p.id) ? html` <span title="Você segue" style=${{color:'var(--accent)'}}><${Icon} n="bookmark" s=${11}/></span>` : null}<span className="sub">${p.desc}</span></td>
              <td><span className="who-n">${p.cliente}</span><span className="sub">${p.contrato}</span></td>
              <td className="hide-md" style=${{color:'var(--ink-2)'}}>${p.area}</td>
              <td>${p.diasParado >= PARADO ? html`<span className="status s-parcial">Parado há ${p.diasParado} dias</span>` : html`<span className="status s-neutro">${p.status}</span>`}<span className="sub">Últ. mov. ${quando(p.lastUpdate)}</span></td>
              <td className="r num">${p.valorCausa ? fmtK(p.valorCausa) : '—'}<span className="sub" style=${{textAlign:'right'}}>${p.valorCausa ? p.prognostico : ''}</span></td>
              <td className="r num" style=${{fontWeight: bl ? 500 : 400, color: bl ? 'var(--ink)' : 'var(--ink-3)'}}>${bl ? fmtK(bl) : '—'}</td>
            </tr>`; })}
            ${list.length ? null : html`<tr><td colSpan="6" className="empty">Nenhum processo com esses filtros.</td></tr>`}</tbody>
        </table></div>
      <//>
      <aside className="card panel st" style=${{animationDelay:'140ms'}}>${cur ? html`<${ProcDetail} key=${cur.id} p=${cur} go=${go} seg=${seg} toggleSeg=${toggleSeg} ask=${ask}/>` : html`<div className="empty-p">Nenhum processo selecionado.</div>`}</aside>
    </div>
  </div>`;
}

/* ================= Bloqueios ================= */

      <div className="kpi st" style=${{cursor:'default',animationDelay:'140ms'}}><span className="kl"><i style=${{color:MONEY.devolvido}}><${Icon} n="check" s=${15}/></i>Devolvido ao cliente</span><span className="kv"><${CountUp} to=${dev} fmt=${fmtK}/></span><span className="ks">${Math.round(dev / orig * 100)}% do total</span></div>
      <div className="kpi st" style=${{cursor:'default',animationDelay:'190ms'}}><span className="kl"><i style=${{color:MONEY.perdido}}><${Icon} n="x" s=${15}/></i>Perdido</span><span className="kv"><${CountUp} to=${per} fmt=${fmtK}/></span><span className="ks">${Math.round(per / orig * 100)}% do total, transferido ao credor</span></div>
    </div>
    <div className="card st" style=${{animationDelay:'220ms',padding:'16px 20px'}}>
      <${MoneyBar} big devolvido=${dev} perdido=${per} bloqueado=${hoje}/>
      <div style=${{marginTop:10}}><${Legend} items=${[['Devolvido', MONEY.devolvido], ['Perdido', MONEY.perdido], ['Ainda bloqueado', MONEY.bloqueado]]}/></div>
    </div>
    <div className="md">
      <${Card} delay="260ms">
        <div className="toolbar">
          <div className="seg" role="group" aria-label="Situação">${ABAS.map(([k, l, fn]) => html`<button key=${k} aria-pressed=${aba === k} onClick=${() => { setAba(k); setSel(null); }}>${l} <span className="cnt">${base.filter(fn).length}</span></button>`)}</div>
          <span className="grow"></span>
          <label className="search"><${Icon} n="search" s=${14}/><input id="bloq-q" placeholder="Cliente, contrato ou processo" value=${q} onInput=${e => setQ(e.target.value)}/></label>

const samplePromise = (window.claude && window.claude.use) ? window.claude.use('sample').catch(() => null) : Promise.resolve(null);

function splitBlocks(t){
  const out = []; const re = /```(\w+)[^\n]*\n([\s\S]*?)```/g; let last = 0, m;
  while ((m = re.exec(t))) { if (m.index > last) out.push({k:'md', v:t.slice(last, m.index)}); out.push({k:m[1], v:m[2]}); last = re.lastIndex; }
  const rest = t.slice(last), open = rest.indexOf('```');
  if (open >= 0) { if (open > 0) out.push({k:'md', v:rest.slice(0, open)}); out.push({k:'pending'}); }
  else if (rest) out.push({k:'md', v:rest});
  return out;
}
function inline(s){ return s.split(/(\*\*[^*]+\*\*)/g).map((x, i) => x.startsWith('**') && x.endsWith('**') ? html`<strong key=${i}>${x.slice(2, -2)}</strong>` : x); }
function MD({text}){
  const lines = text.split('\n'); const out = []; let list = null;
  const flush = () => { if (list) { out.push(list.ord ? html`<ol key=${out.length}>${list.items}</ol>` : html`<ul key=${out.length}>${list.items}</ul>`); list = null; } };
  for (const raw of lines) { const l = raw.trim();
    if (!l) { flush(); continue; }
    let m;
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { flush(); out.push(html`<h3 key=${out.length}>${inline(m[1])}</h3>`); continue; }
    if ((m = l.match(/^[-*•]\s+(.*)/)) || (m = l.match(/^(\d+)[.)]\s+(.*)/))) { const ord = /^\d/.test(l); const txt = ord ? m[2] : m[1];
      if (!list || list.ord !== ord) { flush(); list = {ord, items:[]}; } list.items.push(html`<li key=${list.items.length}>${inline(txt)}</li>`); continue; }
    flush(); out.push(html`<p key=${out.length}>${inline(l)}</p>`);
  }
  flush(); return html`<div className="md-t">${out}</div>`;
}
const fmtU = u => u === 'BRL' ? fmtK : fmtN;

function Grafico({src, onOpen}){
  let g; try { g = JSON.parse(src); } catch (e) { return html`<div className="pending">Gráfico em formato inválido.</div>`; }
  try {
    if (g.tipo === 'indicadores') return html`<div className="ind">${(g.itens || []).slice(0, 4).map((it, i) => { const r = D.ra(it.consulta);
      let delta = null;
      if (it.comparar_com) { const r2 = D.ra(it.comparar_com); if (r2.total) { const pc = Math.round((r.total / r2.total - 1) * 100); const bom = it.bom_quando === 'sobe' ? pc > 0 : pc < 0;
        delta = html`<span className=${'delta ' + (pc === 0 ? 'neutral' : bom ? 'good' : 'bad')}>${pc > 0 ? '+' : ''}${pc}% ${it.comparacao || ''}</span>`; } }
      return html`<div key=${i}><small>${it.rotulo}</small><b className="num">${fmtU(r.unidade)(r.total)}</b>${delta}</div>`; })}</div>`;
    if (g.tipo === 'tabela') { const rows = D.i2(g.processos || {});
      return html`<div className="gcard">${g.titulo ? html`<h5>${g.titulo}</h5>` : null}<div className="tbl-wrap"><table className="sel"><thead><tr><th>Processo</th><th>Cliente</th><th>Parado</th><th className="r">Bloqueado</th></tr></thead>
        <tbody>${rows.map(r => html`<tr key=${r.numero} onClick=${() => onOpen(r.numero)}><td><span className="mono">${r.numero}</span><span className="sub">${r.descricao}</span></td><td>${r.cliente}<span className="sub">${r.contrato}</span></td><td className="num">${r.dias_parado} dias</td><td className="r num">${r.valor_bloqueado_ativo ? fmtK(r.valor_bloqueado_ativo) : '—'}</td></tr>`)}</tbody></table></div></div>`; }
    if (g.tipo === 'empilhado') { const r = D.o2(g.consulta); const cores = r.partes.map((p, k) => PROG_COR[p] || ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--info)', 'var(--warn)'][k % 5]);
      return html`<div className="gcard">${g.titulo ? html`<h5>${g.titulo}</h5>` : null}
        <${HBars} rows=${r.grupos.map(x => ({label:x.rotulo, total:x.total, vals:x.valores}))} parts colors=${cores} fmt=${fmtU(r.unidade)}/>
        <${Legend} items=${r.partes.map((p, k) => [p, cores[k]])}/></div>`; }
    if (g.tipo === 'linha') { const ss = g.series || [{rotulo:g.titulo, consulta:g.consulta}]; const rs = ss.map(s => D.ra(s.consulta));
      const cats = rs[0].grupos.map(x => x.rotulo); const cores = ['var(--accent)', 'var(--info)', 'var(--warn)'];
      return html`<${GLinha} titulo=${g.titulo} cats=${cats} lines=${rs.map((r, k) => ({label:ss[k].rotulo || '', color:cores[k % 3], vals:cats.map(c => (r.grupos.find(x => x.rotulo === c) || {}).valor ?? null)}))} fmt=${fmtU(rs[0].unidade)} multi=${ss.length > 1}/>`; }
    /* barras */
    const ss = g.series || [{rotulo:'', consulta:g.consulta}]; const rs = ss.map(s => D.ra(s.consulta)); const u = fmtU(rs[0].unidade);
    if (rs.length === 1) return html`<div className="gcard">${g.titulo ? html`<h5>${g.titulo}</h5>` : null}<${HBars} rows=${rs[0].grupos.slice(0, 12).map(x => ({label:x.rotulo, value:x.valor}))} fmt=${u}/></div>`;
    const labels = [...new Set(rs.flatMap(r => r.grupos.map(x => x.rotulo)))]; const cores = ['var(--c1)', 'var(--c2)', 'var(--info)'];
    return html`<div className="gcard">${g.titulo ? html`<h5>${g.titulo}</h5>` : null}
      ${labels.slice(0, 10).map(l => html`<div key=${l}><div className="who-s" style=${{marginBottom:6}}>${l}</div><${HBars} rows=${rs.map((r, k) => ({label:ss[k].rotulo, value:(r.grupos.find(x => x.rotulo === l) || {valor:0}).valor, color:cores[k]}))} fmt=${u}/></div>`)}
      <${Legend} items=${ss.map((s, k) => [s.rotulo, cores[k]])}/></div>`;
  } catch (e) { return html`<div className="pending">Não consegui montar este gráfico: ${String(e.message || e)}</div>`; }
}
function GLinha({titulo, cats, lines, fmt, multi}){
  const [s, setS] = useState(null);
  return html`<div className="gcard">${titulo ? html`<h5>${titulo}</h5>` : null}
    <${LineChart} cats=${cats} lines=${lines} fmt=${fmt} sel=${s} onSel=${setS} label=${titulo || 'Gráfico de linha'} area=${!multi}/>
    ${multi ? html`<${Legend} items=${lines.map(l => [l.label, l.color])}/>` : null}
    ${s != null ? html`<div className="detail"><b>${cats[s]}</b>${lines.map(l => html`<span key=${l.label}> · ${l.label} <b className="num">${l.vals[s] == null ? 'sem dado' : fmt(l.vals[s])}</b></span>`)}</div>` : null}</div>`;
}
function Acoes({src, onOpen, seg, toggleSeg}){
  let a; try { a = JSON.parse(src); } catch (e) { return null; }
  const ps = (a.processos || []).map(procByNum).filter(Boolean).slice(0, 6);
  if (!ps.length) return null;
  return html`<div className="gcard">${a.titulo ? html`<h5>${a.titulo}</h5>` : null}<div className="acs">${ps.map((p, i) => { const bl = bloqAtivo(p);
    return html`<div key=${p.id} className="ac" style=${{animationDelay: (i * 80) + 'ms'}}>

      <div><div className="n">${p.cliente}</div><div className="s">${p.desc}</div></div>
      <div className="r s"><span>${p.diasParado >= PARADO ? `Parado há ${p.diasParado} dias` : `Últ. mov. ${quando(p.lastUpdate)}`}</span><b className="num" style=${{color: bl ? 'var(--warn)' : 'var(--ink-3)', fontWeight:500}}>${bl ? fmtK(bl) + ' bloqueado' : 'sem bloqueio'}</b></div>
      <div className="r"><button className="btn sm ghost" onClick=${() => onOpen(p.numero)}>Abrir processo</button>
        <button className=${'btn sm ' + (seg.has(p.id) ? 'on' : 'ghost')} onClick=${() => toggleSeg(p.id)}><${Icon} n="bookmark" s=${13}/>${seg.has(p.id) ? 'Seguindo' : 'Seguir'}</button></div>
    </div>`; })}</div></div>`;
}
function Resposta({text, onOpen, onAsk, seg, toggleSeg, done}){
  return splitBlocks(text).map((b, i) => {
    if (b.k === 'md') return html`<${MD} key=${i} text=${b.v}/>`;
    if (b.k === 'grafico') return html`<${Grafico} key=${i} src=${b.v} onOpen=${onOpen}/>`;
    if (b.k === 'acoes') return html`<${Acoes} key=${i} src=${b.v} onOpen=${onOpen} seg=${seg} toggleSeg=${toggleSeg}/>`;
    if (b.k === 'sugestoes') { let s = []; try { s = JSON.parse(b.v); } catch (e) {}
      return done ? html`<div key=${i} className="sugs" style=${{flexDirection:'row',flexWrap:'wrap'}}>${s.map(x => html`<button key=${x} className="sug" onClick=${() => onAsk(x)}><span className="sug-ic" style=${{background:'var(--accent)'}}><${Icon} n="sparkle" s=${12}/></span>${x}</button>`)}</div>` : null; }
    if (b.k === 'pending') return html`<div key=${i} className="pending"><${Icon} n="sparkle" s=${14}/><span className="shimmer">Montando o gráfico…</span></div>`;
    return null;
  });
}

const SUGESTOES = [
  'Quanto está bloqueado hoje, por cliente?',
  'Quais processos estão parados há mais de 90 dias?',
  'Quanto cada cliente perdeu e recuperou em bloqueios em 2026?',

];

function IA({chat, go, seg, toggleSeg}){
  const {msgs, ask, busy, ctx, setCtx, text, setText, stop, sampleOk} = chat;
  const endRef = useRef(null);
  useEffect(() => { endRef.current && endRef.current.scrollIntoView({block:'end', behavior:REDUCED ? 'auto' : 'smooth'}); }, [msgs.length]);
  const ready = text.trim().length > 0 && !busy;
  const onOpen = num => { const p = procByNum(num); if (p) go('processos', {sel:p.id}); };
  return html`<section className="chat st">
    <div className="chat-bar">
      <span className="ctx"><${Icon} n="sparkle" s=${16}/>Analista de dados do escritório</span>
      <div style=${{display:'flex',gap:8,alignItems:'center'}}>
        ${ctx ? html`<span className="ctxchip">Só ${fe[ctx].name}<button aria-label="Toda a firma" onClick=${() => setCtx(null)}><${Icon} n="x" s=${12}/></button></span>` : html`<span className="ctxchip" style=${{paddingRight:12}}>Toda a firma</span>`}
        ${msgs.length ? html`<button className="btn ghost sm" onClick=${chat.reset}><${Icon} n="refresh" s=${13}/>Nova conversa</button>` : null}
      </div>
    </div>
    ${!msgs.length ? html`<div className="idle rev">
      <span className="sug-ic" style=${{background:'var(--accent)',width:44,height:44}}><${Icon} n="sparkle" s=${20}/></span>
      <h2>Pergunte sobre processos, bloqueios e contratos</h2>
      <p className="who-s" style=${{maxWidth:'52ch',margin:0}}>A IA consulta a base do escritório e o app desenha os gráficos com esses dados. Os números nunca vêm da cabeça dela.</p>
      <div className="sugs">${SUGESTOES.map(s => html`<button key=${s} className="sug" onClick=${() => ask(s)}><span className="sug-ic" style=${{background:'var(--accent)'}}><${Icon} n="sparkle" s=${12}/></span>${s}</button>`)}</div>
      ${sampleOk === null ? html`<div className="err" style=${{maxWidth:520}}>A IA só responde com o app aberto no Claude. Abra este link no claude.ai para conversar com os dados.</div>` : null}
    </div>` : html`<div className="thread">
      ${msgs.map((m, i) => m.role === 'user' ? html`<div key=${i} className="bubble">${m.text}</div>` : html`<div key=${i} className="msg-a">
        ${m.status === 'erro' ? html`<div className="err">${m.erro}</div>` : null}
        ${!m.text && m.status === 'streaming' ? html`<div>
          <div className="thinking"><${Icon} n="sparkle" s=${16}/><span className="shimmer">Pensando…</span></div>
          <div className="steps2">${m.steps.map((s, k) => html`<span key=${k}><${Icon} n=${k < m.steps.length - 1 ? 'check' : 'clock'} s=${12}/>${s}</span>`)}</div></div>` : null}
        ${m.text ? html`${m.steps.length ? html`<div className="ans-hi">${m.steps.length} ${m.steps.length === 1 ? 'consulta' : 'consultas'} à base do escritório</div>` : null}
          <${Resposta} text=${m.text} onOpen=${onOpen} onAsk=${ask} seg=${seg} toggleSeg=${toggleSeg} done=${m.status !== 'streaming'}/>` : null}
        ${m.status === 'ok' ? html`<div className="acts"><div>
          <button className="ibtn" aria-label="Copiar resposta" onClick=${() => { try { navigator.clipboard.writeText(m.text).catch(() => {}); } catch (e) {} }}><${Icon} n="copy" s=${15}/></button>
          <button className="ibtn" aria-label="Perguntar de novo" onClick=${() => ask(msgs[i - 1].text)}><${Icon} n="refresh" s=${15}/></button></div></div>` : null}
      </div>`)}
      <div ref=${endRef}></div>
    </div>`}
    <form className="composer" onSubmit=${e => { e.preventDefault(); if (ready) ask(text); }}>
      <textarea id="chat-box" rows="2" aria-label="Nova pergunta" placeholder="Pergunte como falaria com um colega" value=${text} onInput=${e => setText(e.target.value)}
        onKeyDown=${e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (ready) ask(text); } }}></textarea>
      <div className="comp-row"><div><span className="model"><${Icon} n="lock" s=${12}/>Só leitura: nada muda no Legal One</span></div>
        <div>${busy ? html`<button type="button" className="btn ghost sm" onClick=${stop}>Parar</button>` : null}
          <button type="submit" className=${'send' + (ready ? ' ready' : '')} aria-label="Enviar" disabled=${!ready}><${Icon} n="up" s=${15} w=${2}/></button></div></div>
    </form>

}

function useChat(){
  const [msgs, setMsgs] = useState([]);
  const [busy, setBusy] = useState(false);
  const [ctx, setCtx] = useState(null);
  const [text, setText] = useState('');
  const [sampleOk, setSampleOk] = useState(undefined);
  const ctrl = useRef(null), msgsRef = useRef(msgs), ctxRef = useRef(ctx);
  msgsRef.current = msgs; ctxRef.current = ctx;
  useEffect(() => { samplePromise.then(s => setSampleOk(s ? true : null)); }, []);
  const patchLast = f => setMsgs(ms => { const c = ms.slice(); c[c.length - 1] = f(c[c.length - 1]); return c; });
  const ask = async (q, cli) => {
    const t = (q || '').trim(); if (!t || busy) return;
    if (cli !== undefined) { setCtx(cli); ctxRef.current = cli; }
    setText('');
    const hist = [...msgsRef.current, {role:'user', text:t}];
    setMsgs([...hist, {role:'assistant', text:'', status:'streaming', steps:[]}]);
    setBusy(true);
    const sample = await samplePromise;
    if (!sample) { patchLast(m => ({...m, status:'erro', erro:'A IA só responde com o app aberto no Claude. Abra este link no claude.ai para conversar com os dados.'})); setBusy(false); return; }
    const ac = new AbortController(); ctrl.current = ac;
    const progress = s => patchLast(m => ({...m, steps:[...m.steps, s]}));
    const conv = hist.filter(m => m.text && !(m.role === 'assistant' && m.status === 'erro')).map(m => ({role:m.role, content:m.text})).slice(-12);
    while (conv.length && conv[0].role !== 'user') conv.shift();
    const input = [{role:'user', content:D.Mk(ctxRef.current) + NOTA_DESKTOP}, {role:'assistant', content:'Entendido. Vou consultar a base antes de qualquer número.'}, ...conv];
    try {
      const r = await sample(input, {tools:[...D.Fk(progress), ferramentaProcesso(progress)], signal:ac.signal, modelTier:'default', cache:false,
        onText:({text}) => patchLast(m => ({...m, text}))});
      patchLast(m => ({...m, text:r.text || m.text, status:'ok'}));
    } catch (e) {
      if (ac.signal.aborted) patchLast(m => ({...m, status: m.text ? 'ok' : 'erro', erro:'Resposta interrompida.'}));
      else patchLast(m => ({...m, status:'erro', text:e && e.text ? e.text : m.text, erro:D.l2(e)}));
    } finally { setBusy(false); ctrl.current = null; }
  };
  const stop = () => ctrl.current && ctrl.current.abort();
  const reset = () => { stop(); setMsgs([]); };
  return {msgs, ask, busy, ctx, setCtx, text, setText, stop, reset, sampleOk};
}

/* ================= Busca (⌘K) ================= */
function Busca({onClose, go}){
  const [q, setQ] = useState(''); const [i, setI] = useState(0); const ref = useRef(null);
  useEffect(() => { ref.current && ref.current.focus(); }, []);
  const f = q.trim().toLowerCase();
  const itens = [
    ...ti.filter(id => !f || fe[id].name.toLowerCase().includes(f)).map(id => ({g:'Clientes', t:fe[id].name, s:`${fe[id].contratos.length} contratos · ${fe[id].bloqueado} bloqueado`, ic:'building', go:['clientes', {cli:id}]})),
    ...za.filter(r => f && (r.numero + r.cliente + r.assunto).toLowerCase().includes(f)).map(r => ({g:'Reclamações', t:r.numero, s:r.assunto, ic:'landmark', go:['reclamacoes', {}]})),
    ...Se.filter(p => f && (p.numero + p.desc + p.cliente + p.contrato).toLowerCase().includes(f)).slice(0, 8).map(p => ({g:'Processos', t:p.numero, s:`${p.cliente} · ${p.desc}`, ic:'scale', go:['processos', {sel:p.id}]})),
    ...(f ? [{g:'IA', t:`Perguntar à IA: “${q.trim()}”`, s:'Consulta a base do escritório', ic:'sparkle', ia:q.trim()}] : [])
  ];
  const abrir = it => { onClose(); it.ia ? go('ia', {pergunta:it.ia}) : go(...it.go); };
  let ult = null;
  return html`<div className="cmd" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="cmd-box" role="dialog" aria-modal="true" aria-label="Buscar">
      <div className="cmd-in"><${Icon} n="search" s=${18}/><input ref=${ref} id="busca" placeholder="Buscar processo, cliente ou reclamação" value=${q}
        onInput=${e => { setQ(e.target.value); setI(0); }}
        onKeyDown=${e => { if (e.key === 'Escape') onClose(); else if (e.key === 'ArrowDown') { e.preventDefault(); setI(x => Math.min(x + 1, itens.length - 1)); } else if (e.key === 'ArrowUp') { e.preventDefault(); setI(x => Math.max(x - 1, 0)); } else if (e.key === 'Enter' && itens[i]) abrir(itens[i]); }}/><span className="kbd">esc</span></div>
      <div className="cmd-l">${itens.map((it, k) => { const head = it.g !== ult; ult = it.g;
        return html`<div key=${k}>${head ? html`<div className="cmd-g">${it.g}</div>` : null}
          <button className="cmd-i" aria-selected=${k === i} onMouseEnter=${() => setI(k)} onClick=${() => abrir(it)}><span className="ev-ic" style=${{width:32,height:32}}><${Icon} n=${it.ic} s=${15}/></span>
            <span style=${{minWidth:0}}><span className=${it.g === 'Processos' ? 'mono' : ''} style=${{color:'var(--ink)'}}>${it.t}</span><small style=${{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>${it.s}</small></span></button></div>`; })}
        ${itens.length ? null : html`<div className="empty-p">Nada encontrado.</div>`}</div>
    </div></div>`;
}

const NAV = [['painel','Painel','grid'],['processos','Processos','scale'],['bloqueios','Bloqueios','lock'],['clientes','Clientes','building'],['reclamacoes','Reclamações','landmark'],['desempenho','Desempenho','trend'],['ia','Pergunte à IA','sparkle']];

function greeting(){ const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
const sysDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
const VIEWS = NAV.map(n => n[0]);

function App(){
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem('pauta-theme'); } catch (e) { return null; } });
  const [sysIsDark, setSysIsDark] = useState(sysDark());
  const ini = (location.hash || '').slice(1);
  const [nav, setNav] = useState({view: VIEWS.includes(ini) ? ini : 'painel', opts:{}, n:0});
  const [boxText, setBoxText] = useState('');
  const [busca, setBusca] = useState(false);
  const [seg, toggleSeg] = useSeguidos();
  const chat = useChat();
  const typeTok = useRef(null);
  useEffect(() => { const r = document.documentElement; if (theme) r.setAttribute('data-theme', theme); else r.removeAttribute('data-theme'); try { theme ? localStorage.setItem('pauta-theme', theme) : localStorage.removeItem('pauta-theme'); } catch (e) {} }, [theme]);
  useEffect(() => { const m = window.matchMedia('(prefers-color-scheme: dark)'); const f = () => setSysIsDark(m.matches); m.addEventListener('change', f); return () => m.removeEventListener('change', f); }, []);
  useEffect(() => { const k = e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setBusca(b => !b); } }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, []);
  const dark = theme ? theme === 'dark' : sysIsDark;
  const go = (view, opts = {}) => {
    setNav(n => ({view, opts, n:n.n + 1})); window.scrollTo({top:0, behavior:'auto'});
    try { history.replaceState(null, '', '#' + view); } catch (e) {}
    if (view === 'ia' && opts.pergunta) chat.ask(opts.pergunta, opts.cli);
  };
  const ask = (t, cli) => { if (!(t || '').trim()) return; if (typeTok.current) typeTok.current.stop = true; setBoxText(''); go('ia'); chat.ask(t, cli); };
  const typeInto = (text, set) => { if (typeTok.current) typeTok.current.stop = true; const tok = {stop:false}; typeTok.current = tok; return typeText(text, set, tok, 22); };
  const {view, opts} = nav;
  const props = {opts, go, seg, toggleSeg, ask};
  return html`<div className="app">
    <${Header} active=${view} onNav=${k => go(k)} dark=${dark} toggleTheme=${() => setTheme(dark ? 'light' : 'dark')} onBusca=${() => setBusca(true)}/>
    <main className="v-in" key=${view + nav.n}>
      ${view === 'painel' ? html`<${Painel} go=${go} ask=${ask} boxText=${boxText} setBoxText=${setBoxText} typeInto=${typeInto}/>`
      : view === 'processos' ? html`<${Processos} ...${props}/>`
      : view === 'bloqueios' ? html`<${Bloqueios} ...${props}/>`
      : view === 'clientes' ? html`<${Clientes} ...${props}/>`
      : view === 'reclamacoes' ? html`<${Reclamacoes} go=${go}/>`
      : view === 'desempenho' ? html`<${Desempenho}/>`
      : html`<${IA} chat=${chat} go=${go} seg=${seg} toggleSeg=${toggleSeg}/>`}
    </main>
    ${busca ? html`<${Busca} onClose=${() => setBusca(false)} go=${go}/>` : null}
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
